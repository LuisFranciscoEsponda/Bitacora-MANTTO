<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora IDRIS</title>
<meta name="description" content="Acceso a Bitácora IDRIS — sistema de mantenimiento de PDA Argentina.">
<meta http-equiv="refresh" content="3;url=https://claude.ai/artifact/TQ8h4RRdVnjeEcpHRZka8u">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg-0: #071118;
    --bg-1: #0d1f27;
    --ink: #eaf3f4;
    --muted: #9fb6bd;
    --line: rgba(234, 243, 244, 0.14);
    --accent: #3fc7de;
    --accent-ink: #052230;
    --surface: rgba(15, 32, 40, 0.72);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 620px at 12% -10%, rgba(63,199,222,0.16), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, rgba(201,96,63,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 34px 30px 28px;
    text-align: center;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px -24px rgba(0,0,0,0.6);
  }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #2a8fa3);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px -8px rgba(63,199,222,0.55);
  }
  .mark svg { width: 24px; height: 24px; }
  .eyebrow {
    font: 700 11px/1 "JetBrains Mono", monospace;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  h1 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800; font-size: 34px; line-height: 1;
    margin: 0 0 10px; letter-spacing: -0.01em;
  }
  p.sub {
    color: var(--muted); font-size: 14px; line-height: 1.5;
    margin: 0 0 26px;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-ink);
    font: 700 15px/1 "Source Sans 3", sans-serif;
    padding: 13px 22px; border-radius: 10px; text-decoration: none;
    box-shadow: 0 10px 26px -12px rgba(63,199,222,0.6);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .foot {
    margin-top: 22px; font: 500 10.5px/1.4 "JetBrains Mono", monospace;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" stroke="#071118" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12l2 2 4-4" stroke="#071118" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="eyebrow">PDA Argentina · Mantenimiento</div>
    <h1>Bitácora IDRIS</h1>
    <p class="sub">Te estamos redirigiendo al sistema. Si no ocurre en unos segundos, entrá con el botón.</p>
    <a class="btn" href="https://claude.ai/artifact/TQ8h4RRdVnjeEcpHRZka8u" rel="noopener">Abrir Bitácora IDRIS →</a>
    <div class="foot">Sistema interno · Acceso restringido</div>
  </div>
</body>
</html>
